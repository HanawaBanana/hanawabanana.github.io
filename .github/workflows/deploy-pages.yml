name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: china-model-rank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: china-model-rank/package-lock.json
      - run: npm ci
      - name: Build static site
        env:
          NEXT_PUBLIC_DISABLE_ANALYTICS: "1"
          NEXT_PUBLIC_BASE_PATH: "/china-model-rank"
          NEXT_PUBLIC_SITE_URL: "https://hanawabanana.github.io/china-model-rank"
          NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-W80TF1WPB4"
        run: npm run build
      - name: Stage site under subpath
        run: |
          rm -rf ../page-artifact
          mkdir -p ../page-artifact/china-model-rank
          cp -R out/. ../page-artifact/china-model-rank/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: page-artifact
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
